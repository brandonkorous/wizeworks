apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wizeworks

# The namespace is applied on its own (k8s/namespace.yaml) before either app,
# because kustomize will not load a file from outside this directory.
resources:
  - deployment.yaml
  - service.yaml

# The workflow rewrites this to the commit SHA before applying, so a rollout is
# always to an immutable tag even though the manifest reads `latest`.
images:
  - name: ghcr.io/brandonkorous/wizeworks-admin
    newTag: latest
