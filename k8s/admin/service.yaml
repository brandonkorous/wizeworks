# Port 80 → container 3000, like the site: Caddy addresses every co-tenant as
# `<svc>.<ns>.svc.cluster.local:80`, so the route in the sparx repo reads
# `admin.wizeworks.svc.cluster.local:80`.
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: wizeworks
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: wizeworks
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
