apiVersion: apps/v1
kind: Deployment
metadata:
  name: site
  namespace: wizeworks
  labels:
    app.kubernetes.io/name: site
    app.kubernetes.io/part-of: wizeworks
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: site
        app.kubernetes.io/part-of: wizeworks
    spec:
      # No imagePullSecrets — the GHCR package is public and the kubelet pulls
      # anonymously, matching kanninja and jotDOJO on this cluster.
      containers:
        - name: site
          image: ghcr.io/wizeworksllc/wizeworks-site:latest
          # Always, not IfNotPresent: `:latest` is mutable, and a bare pod
          # restart on a node holding a stale cached layer would silently serve
          # the previous release. The workflow pins to a SHA tag anyway, so this
          # only matters for out-of-band restarts.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
            # Tracing (WizeLens), send-only: a quarter of requests go to
            # WizeLens Cloud, project `wizeworks`. The ingest key is this app's
            # own (vault `wizelens-key-wizeworks-site`, written into
            # `site-secrets` by the deploy workflow). It is optional, so a
            # missing key leaves the site running and untraced, never failing.
            - name: WIZELENS_ENABLED
              value: 'true'
            - name: WIZELENS_HUB
              value: https://app.wizelens.com
            - name: WIZELENS_SAMPLE_RATE
              value: '0.25'
            - name: WIZELENS_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: site-secrets
                  key: WIZELENS_KEY_WIZEWORKS_SITE
                  optional: true
            # Contact-form delivery is intentionally unconfigured — the route
            # validates and returns 503 rather than pretending to send. Set
            # CONTACT_TO and CONTACT_EMAIL here (or from a Secret) to switch it
            # on; see site/app/api/contact/route.ts.
          resources:
            requests:
              cpu: '100m'
              memory: '192Mi'
            limits:
              cpu: '1000m'
              memory: '512Mi'
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Next writes its image cache under .next
            capabilities:
              drop: ['ALL']
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                # Let the LoadBalancer stop sending new connections before the
                # process goes away, so a rollout drops nothing.
                command: ['/bin/sh', '-c', 'sleep 5']
      terminationGracePeriodSeconds: 30
