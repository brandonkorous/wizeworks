name: Build & Deploy to AKS

# Two apps ship from this repo, each to the shared `aks-sparx-prod-cus` cluster
# in the `wizeworks` namespace:
#
#   site/    wize.works          the marketing site
#   admin/   admin.wize.works    the operator console
#
# A push to main deploys only the app whose files changed; the steps themselves
# are in deploy-app.yml. A pull request runs the same checks without deploying.
#
# WizeWorks is a CO-TENANT here, the same way silicaui, kanninja, jotacular and
# agconn are: its own namespace, its own repo, its own image. The only shared
# thing is the cluster and the single Caddy routing table that lives in the
# wize-infrastructure repo (wizeworksllc/wize-infrastructure), see
# k8s/ingress/Caddyfile there. Adding a host is a change in THAT repo, released
# by its own release, not this one.
#
# AUTH: workload identity federation, no stored credential. Azure trusts a
# GitHub OIDC token whose subject is
#
#   repo:brandonkorous@13042540/wizeworks@1349021052:ref:refs/heads/main
#
# NOTE THE NUMERIC IDS. GitHub qualifies the OIDC subject per repository, by
# age — AgConnect and kanninja are old enough to keep the plain
# `repo:owner/name` form, while jotacular and this repo get the qualified one.
# The credential must match byte for byte; on a mismatch Entra reports only the
# subject it RECEIVED, never the one it expected. Read it back rather than
# assembling it:
#
#   gh api repos/brandonkorous/wizeworks/actions/oidc/customization/sub \
#     --jq .sub_claim_prefix
#
# The credential is provisioned by Terraform, not by hand — see
# terraform/bootstrap-azure/wizeworks.tf in the wize-infrastructure repo,
# applied by that repo's release. The three AZURE_*
# values are repository VARIABLES rather than secrets: they are public
# identifiers, and hiding them only makes a failed run harder to read.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        options: [both, site, admin]
        default: both

permissions:
  contents: read
  id-token: write # federated auth to Azure
  packages: write # push to GHCR

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which apps this change touches. Docs and mockups touch neither: the repo
  # root carries ~146 MB of concept PNGs and three long specs, and editing those
  # should not roll production.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.pick.outputs.site }}
      admin: ${{ steps.pick.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - '.dockerignore'
              - 'k8s/namespace.yaml'
              - '.github/workflows/deploy.yml'
              - '.github/workflows/deploy-app.yml'
            site:
              - 'site/**'
              - 'k8s/site/**'
            admin:
              - 'admin/**'
              - 'k8s/admin/**'
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.app }}
          SHARED: ${{ steps.filter.outputs.shared }}
          SITE: ${{ steps.filter.outputs.site }}
          ADMIN: ${{ steps.filter.outputs.admin }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$CHOICE" != admin ] && SITE=true || SITE=false
            [ "$CHOICE" != site ] && ADMIN=true || ADMIN=false
          elif [ "$SHARED" = true ]; then
            SITE=true; ADMIN=true
          fi
          echo "site=$SITE" >> "$GITHUB_OUTPUT"
          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"
          echo "site=$SITE admin=$ADMIN"

  site:
    name: site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: site
      deploy: ${{ github.event_name != 'pull_request' }}
      health-path: /api/health
      # Optional: without the key the site rolls out untraced.
      vault-secrets: |
        WIZELENS_KEY_WIZEWORKS_SITE=wizelens-key-wizeworks-site?
      warm-urls: |
        https://wize.works/
        https://wize.works/work
        https://wize.works/products
        https://wize.works/about
        https://wize.works/_next/image?url=%2Fproducts%2Fjotacular.png&w=640&q=75
        https://wize.works/_next/image?url=%2Fproducts%2Fagconn.png&w=828&q=75
        https://wize.works/images/machine-shop-1920.avif

  admin:
    name: admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: admin
      deploy: ${{ github.event_name != 'pull_request' }}
      health-path: /health
      actions-key-secret: next-actions-key-admin
      # The first three are required: without them no operator can sign in, so
      # the deploy stops by name rather than shipping a console that 500s.
      # OPERATOR_AUTH_SECRET is stored as base64 because its last byte is a
      # carriage return (see deploy-app.yml).
      vault-secrets: |
        OPERATOR_DATABASE_URL=operator-database-url
        OPERATOR_AUTH_SECRET=operator-auth-secret-b64
        SPARX_INTERNAL_OPERATOR_TOKEN=sparx-internal-operator-token
        OPERATOR_BOOTSTRAP_PASSWORD=operator-bootstrap-password?
        NEXT_ACTIONS_KEY_ADMIN=next-actions-key-admin?
        WIZELENS_KEY_ADMIN=wizelens-key-admin?
