name: Build & Deploy to AKS

# Builds the marketing site image, pushes it to GHCR, and rolls it out to the
# shared `aks-sparx-prod-cus` cluster in a `wizeworks` namespace of its own.
#
# WizeWorks is a CO-TENANT here, the same way silicaui, kanninja, jotacular and
# agconn are: its own namespace, its own repo, its own image. The only shared
# thing is the cluster and the single Caddy routing table that lives in the
# sparx repo — see k8s/ingress/Caddyfile there. Adding a host is a change in
# THAT repo, not this one.
#
# AUTH: workload identity federation, no stored credential. Azure trusts a
# GitHub OIDC token whose subject is
#   repo:brandonkorous/wizeworks:ref:refs/heads/main
# That federated credential must exist on the app registration before the first
# deploy — see the checklist in k8s/README.md. The three AZURE_* values are
# repository VARIABLES rather than secrets: they are public identifiers, and
# hiding them only makes a failed run harder to read. This mirrors kanNINJA.

on:
  push:
    branches: [main]
    paths:
      # Docs and mockups do not produce a deployment. The repo root carries
      # ~146 MB of concept PNGs and three long specs; editing those should not
      # roll production.
      - 'site/**'
      - 'k8s/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # federated auth to Azure
  packages: write # push to GHCR

env:
  RESOURCE_GROUP: rg-sparx-prod-cus
  CLUSTER: aks-sparx-prod-cus
  NAMESPACE: wizeworks
  # Hyphenated, not slashed. `ghcr.io/brandonkorous/wizeworks-site` is a
  # different package from `.../wizeworks/site`, and addressing the wrong one
  # fails as a 401 that reads like a missing tag. The siblings use hyphens.
  IMAGE: ghcr.io/brandonkorous/wizeworks-site

jobs:
  # ------------------------------------------------------------------
  # Gate the build. Cheap, and it catches the class of thing that would
  # otherwise be discovered by a rollout that never becomes ready.
  # ------------------------------------------------------------------
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  build:
    name: Build & push image
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          # Repo root, with .dockerignore excluding docs/ and images/ — that
          # takes the context from ~147 MB to ~1 MB.
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=min,scope=site,ignore-error=true

  deploy:
    name: Roll out to AKS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get cluster credentials
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER" \
            --overwrite-existing

      # Pin to the immutable SHA tag rather than rolling `:latest`. A rollout to
      # a mutable tag is not reproducible and cannot be rolled back by revision.
      - name: Pin image and apply
        run: |
          set -euo pipefail
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          echo "Deploying ${IMAGE}:${SHA_TAG}"

          cd k8s
          kustomize edit set image "${IMAGE}=${IMAGE}:${SHA_TAG}"
          cd ..

          kubectl apply -k k8s/

      - name: Wait for rollout
        run: |
          set -euo pipefail
          if ! kubectl rollout status -n "$NAMESPACE" deploy/site --timeout=300s; then
            echo "::error::Rollout failed — recent pod state:"
            kubectl get pods -n "$NAMESPACE" -o wide
            kubectl describe deploy/site -n "$NAMESPACE" | tail -40
            kubectl logs -n "$NAMESPACE" -l app.kubernetes.io/name=site --tail=100 --all-containers || true
            exit 1
          fi

      # Proves the container actually serves, from inside the cluster. The
      # public hostname depends on a Caddy route that lives in another repo, so
      # a green rollout here does NOT mean wize.works resolves — that is checked
      # separately, once.
      - name: Smoke test the Service
        run: |
          set -euo pipefail
          kubectl run smoke-$RANDOM \
            --namespace "$NAMESPACE" \
            --image=curlimages/curl:8.10.1 \
            --restart=Never --rm -i --quiet --command -- \
            curl -fsS --max-time 10 http://site.wizeworks.svc.cluster.local/api/health
